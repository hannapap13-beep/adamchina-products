<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barefoot Guru // System Online</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 20px;
    }
    .card {
      max-width: 560px;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 36px;
      background: #161b22;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #3fb950;
      border: 1px solid #238636;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.2;
    }
    p {
      color: #8b949e;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    button {
      background: #238636;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    #status {
      margin-top: 18px;
      font-size: 14px;
      color: #58a6ff;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Node Active // v0.1</div>
    <h1>Связь установлена. Сайт в эфире.</h1>
    <p>
      Если ты видишь эту страницу по ссылке, значит GitHub Pages работает,
      хостинг бесплатный, а твой первый узел в сети только что ожил.
    </p>
    <button onclick="ping()">Проверить пульс системы</button>
    <div id="status"></div>
  </div>

  <script>
    const phrases = [
      "Сигнал отличный. Кроссовки на толстой подошве нервничают.",
      "Калибровка запущена. Полет нормальный.",
      "Сервер отвечает: 0 долларов в месяц, 100% автономии.",
      "Тест пройден. Можно загружать настоящий протокол."
    ];
    let i = 0;
    function ping() {
      document.getElementById("status").textContent = "> " + phrases[i % phrases.length];
      i++;
    }
  </script>
</body>
</html>
