<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ГК — Строительство и генподряд полного цикла</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

      line-height: 1.55;
    }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 18, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #232934;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 68px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
      color: #f59e0b;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 22px; flex-wrap: wrap; }
    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-links a:hover { color: #f59e0b; }
    .phone { color: #f3f4f6; text-decoration: none; font-size: 14px; font-weight: 600; }

    /* Секция #1 в логике lms-gc.com/#1 */

      padding: 56px 0 64px;
      border-bottom: 1px solid #232934;
      background: radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.08), transparent 45%);
    }
    .hero-top {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 28px;
      align-items: end;
      margin-bottom: 40px;
    }

      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 12px;
